<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1f2638">
<meta name="apple-mobile-web-app-title" content="Golf Classic">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="apple-touch-icon" href="icon-180.png">

<title>Golf Classic</title>
<style>
:root{--bg:#1f2638;--panel:#262e44;--line:#333c55;--gold:#f5cf4a;--mint:#c2f5d6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;touch-action:none;overscroll-behavior:none}
canvas{position:fixed;left:0;top:0;display:block}
#top{position:fixed;left:0;right:0;top:0;z-index:5;background:var(--bg);padding-top:env(safe-area-inset-top)}
#hdr{text-align:center;padding:10px 12px 8px;position:relative}
#menuBtn{position:absolute;left:8px;top:10px;background:none;border:0;color:#9aa3b9;font-size:15px;padding:4px 6px}
.mbtn{display:flex;flex-direction:column;width:100%;background:#2d3550;color:#fff;border:2px solid #3b4563;border-radius:14px;padding:11px;margin-top:10px;font-size:17px}
.mbtn span{font-size:12.5px;color:#aab1c4;margin-top:2px}.mbtn.gold{background:var(--gold);color:#2a2410;border-color:#d9b23a;box-shadow:0 4px 0 #b8952a}.mbtn.gold span{color:#5a4a18}
.plab{text-align:left;font-size:12px;color:#8f98ae;letter-spacing:.08em;text-transform:uppercase;margin:12px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{background:#2d3550;color:#dfe3ee;border:2px solid #3b4563;border-radius:18px;padding:7px 11px;font-size:14px;font-weight:600}.chip.on{background:var(--gold);color:#2a2410;border-color:var(--gold)}
.pname{color:#c3c9da;font-size:13px;margin:8px 0 10px;text-align:left}
#cBtn{margin-top:6px}
.box{max-height:calc(100vh - 40px);overflow:auto}
#t1{padding:0 54px;font-weight:900;color:var(--gold);letter-spacing:.06em;font-size:21px;text-transform:uppercase}
#t2{color:#b9c0d4;font-size:14px;margin-top:3px}
#dots{display:flex;gap:7px;justify-content:center;padding:8px 0;border-top:1px solid var(--line)}
.dot{width:22px;height:22px;border-radius:50%;background:#333c55;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800}
.dot.cur{border:3px solid var(--gold);background:#3a3a2a}
.dot.under{background:#e8524a}.dot.par{background:#7d879e}.dot.over{background:#4a78d8}
#bar{display:flex;background:var(--panel);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
#bar>div{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:9px 4px}
#bar>div+div{border-left:1px solid var(--line)}
.lab{font-size:11px;color:#aab1c4;letter-spacing:.08em}
#bar b{font-size:17px;font-weight:900;letter-spacing:.04em}
.gold{color:var(--gold)}.mint{color:var(--mint)}
#wa{display:inline-block;color:var(--gold);font-size:19px;transition:transform .4s}
button{font-family:inherit;cursor:pointer}
#tapBtn{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));z-index:4;display:none;background:var(--gold);color:#2a2410;border:0;border-radius:30px;padding:12px 26px;font-size:18px;font-weight:800;box-shadow:0 4px 0 #b8952a}
#birds{position:fixed;right:14px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:4;background:rgba(31,38,56,.92);color:#fff;border:2px solid #3b4563;border-radius:30px;padding:10px 18px;font-size:16px;font-weight:700}
#replay{position:fixed;left:12px;bottom:calc(214px + env(safe-area-inset-bottom));z-index:4;background:#f29a3a;color:#fff;border:3px solid #d97a1c;border-radius:26px;padding:7px 16px;display:none;flex-direction:column;align-items:center;line-height:1.15;box-shadow:0 3px 0 #b8611a}
#replay b{font-size:17px}#replay span{font-size:12px;opacity:.95}
#toast{max-width:92vw;overflow:hidden;text-overflow:ellipsis;position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:4;background:rgba(22,28,42,.88);border-radius:30px;padding:9px 20px;font:600 18px ui-monospace,Menlo,monospace;white-space:nowrap;opacity:0;transition:opacity .3s;pointer-events:none}
#toast.on{opacity:1}
#call{position:fixed;left:50%;transform:translate(-50%,-6px) scale(.85);z-index:4;padding:9px 20px;border-radius:24px;font-weight:900;font-size:20px;letter-spacing:.02em;white-space:nowrap;opacity:0;transition:opacity .25s,transform .25s cubic-bezier(.3,1.6,.5,1);pointer-events:none;box-shadow:0 4px 0 rgba(0,0,0,.25)}
#achT{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 8px);transform:translate(-50%,-140%);z-index:20;background:#2a2410;border:2px solid var(--gold);color:#fff;border-radius:16px;padding:8px 16px;display:flex;gap:10px;align-items:center;transition:transform .35s cubic-bezier(.3,1.5,.5,1);box-shadow:0 6px 20px rgba(0,0,0,.4);max-width:92vw}
#achT.on{transform:translate(-50%,0)}#achT b{color:var(--gold);display:block;font-size:16px}#achT span{font-size:12px;color:#e8e2cc}
#call.on{opacity:1;transform:translate(-50%,0) scale(1)}
#call.great{background:var(--gold);color:#2a2410}#call.good{background:#7dde6a;color:#143510}#call.bad{background:#465473;color:#fff}#call.info{background:rgba(22,28,42,.9);color:#fff}
#card{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;background:rgba(15,20,32,.55);padding:20px}
#card.on{display:flex}
.box{background:var(--bg);border:2px solid #3b4563;border-radius:22px;padding:22px 20px 20px;width:100%;max-width:360px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.4)}
#cT{font-size:30px;font-weight:900;color:var(--gold);letter-spacing:.04em}
#cS{color:#c3c9da;margin:6px 0 14px;font-size:15px;line-height:1.45}
#cB table{width:100%;border-collapse:collapse;margin-bottom:16px;font-size:14px}
#cB td,#cB th{padding:6px 2px;border-bottom:1px solid var(--line)}
#cB th{color:#8f98ae;font-weight:600;font-size:12px}
.sc{display:inline-block;min-width:26px;padding:2px 6px;border-radius:13px;font-weight:800}
.sc.under{background:#e8524a}.sc.par{background:#4b546c}.sc.over{background:#4a78d8}
#cBtn{width:100%;background:var(--gold);color:#2a2410;border:0;border-radius:14px;padding:14px;font-size:18px;font-weight:900;box-shadow:0 4px 0 #b8952a}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:14px}
.tile{background:#2a324b;border-radius:12px;padding:9px 4px 8px}.tv{font-size:19px;font-weight:900;color:var(--gold)}.tl{font-size:11px;color:#c3c9da;margin-top:2px}.ts{font-size:10px;color:#8f98ae}
.newbest{font-size:20px;font-weight:900;color:var(--gold);margin:-4px 0 12px}
.tees{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:4px}
.teeb{display:flex;flex-direction:column;align-items:center;gap:1px;background:#2d3550;color:#fff;border:2px solid #3b4563;border-radius:14px;padding:8px 4px;font-size:15px}
.teeb span{font-size:11.5px;color:#aab1c4}.teeb .tm{font-size:10.5px;color:#8f98ae}.teeb.on{border-color:var(--gold);background:#3a3a2a}
.tdot{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid rgba(0,0,0,.35);margin-bottom:3px;vertical-align:middle}
#spinBtn{position:fixed;right:14px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:4;background:rgba(31,38,56,.92);border:2px solid #3b4563;border-radius:18px;padding:6px 10px 5px;display:flex;flex-direction:column;align-items:center;color:#fff;font-size:11px;font-weight:700;min-width:62px}
#spinBtn.set{border-color:var(--gold)}
.sball{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#d9dde3 70%,#b7bcc6);border:2px solid #222;display:flex;align-items:center;justify-content:center;color:#e8523f;font-size:15px;font-weight:900;margin-bottom:2px}
#spinMenu{position:fixed;right:14px;bottom:calc(150px + env(safe-area-inset-bottom));z-index:6;background:#1f2638;border:2px solid #3b4563;border-radius:16px;padding:6px;display:none;flex-direction:column;gap:4px;width:200px;box-shadow:0 8px 30px rgba(0,0,0,.4)}
#spinMenu.on{display:flex}
#spinMenu button{display:flex;align-items:center;gap:10px;background:#2d3550;border:2px solid transparent;color:#fff;border-radius:11px;padding:7px 9px;text-align:left}
#spinMenu button.on{border-color:var(--gold)}#spinMenu b{font-size:14px}#spinMenu span{font-size:11px;color:#aab1c4;display:block}
#spinMenu .ar{width:24px;font-size:16px;color:#e8523f;font-weight:900;text-align:center}
.xpbar{height:9px;background:#2a324b;border-radius:5px;overflow:hidden;margin:6px 0 2px}.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#f5cf4a,#ffb347)}
.prof{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#c3c9da}.prof b{color:#fff;font-size:15px}
.hstrip{display:flex;align-items:center;gap:8px;background:#232a40;border-radius:12px;padding:7px 10px;font-size:13px;color:#cfd5e4}
.hstrip .who{background:none;border:0;color:#fff;font-weight:700;font-size:13px;padding:0;max-width:40%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hstrip .lv{flex:1;display:flex;align-items:center;gap:6px}.hstrip .xpm{flex:1;height:6px;border-radius:3px;background:#3b4563;overflow:hidden}.hstrip .xpm i{display:block;height:100%;background:var(--gold)}
.hstrip .cash{color:var(--gold);font-weight:800}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.mtile{display:flex;flex-direction:column;align-items:center;gap:2px;background:#2d3550;color:#fff;border:2px solid #3b4563;border-radius:14px;padding:11px 6px}
.mtile .ic{font-size:26px;line-height:1.1}.mtile b{font-size:15px}.mtile span{font-size:11.5px;color:#aab1c4;line-height:1.25}
.mbar{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:14px}
.mbar button{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;background:#232a40;border:1px solid #3b4563;border-radius:12px;padding:7px 2px;color:#cfd5e4;font-size:10.5px;font-weight:600}
.mbar .ic{font-size:20px}.mbar .bd{position:absolute;top:-5px;right:-3px;background:#e8523f;color:#fff;border-radius:9px;font-size:10px;font-weight:800;padding:0 5px;line-height:16px}
.badge{background:#e8523f;color:#fff;border-radius:10px;padding:1px 7px;font-size:11px;font-weight:800;margin-left:4px}
.row{display:flex;align-items:center;gap:8px;text-align:left;background:#2a324b;border-radius:12px;padding:9px 10px;margin-bottom:7px}
.row .rt{flex:1}.row b{font-size:15px}.row .rd{font-size:11.5px;color:#aab1c4;margin-top:1px}
.pips{display:flex;gap:2px;margin-top:5px}.pips i{width:12px;height:6px;border-radius:2px;background:#3b4563}.pips i.on{background:var(--gold)}
.plus{background:var(--gold);color:#2a2410;border:0;border-radius:10px;font-weight:900;font-size:13px;padding:8px 10px;white-space:nowrap}.plus:disabled{background:#3b4563;color:#7d869c}
.tier{text-align:left}.tier.lock{opacity:.55}
.lb{width:100%;border-collapse:collapse;font-size:13.5px;margin-bottom:14px}.lb td{padding:5px 3px;border-bottom:1px solid var(--line)}.lb tr.me td{color:var(--gold);font-weight:800}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid #3b4563;padding:0}.sw.on{border:3px solid var(--gold);transform:scale(1.1)}
.how{text-align:left;font-size:14px;color:#c3c9da;line-height:1.5;margin:0 0 16px;padding-left:18px}
#sab{position:fixed;bottom:0;height:env(safe-area-inset-bottom);width:1px;pointer-events:none}
</style>
</head>
<body>
<div id="top">
  <div id="hdr"><button id="menuBtn">‹ Menu</button><div id="t1">Parkland Classic</div><div id="t2">&nbsp;</div></div>
  <div id="dots"></div>
  <div id="bar">
    <div><span class="lab">WIND</span><span id="wa">➜</span><b id="ws" class="gold">CALM</b><b id="wm" class="gold" style="font-size:15px">0mph</b></div>

  </div>
</div>
<canvas id="c"></canvas>
<button id="tapBtn">👆 Tap in</button><button id="birds">🦅 Bird’s-eye</button>
<button id="spinBtn"><span class="sball"><span id="sArrow"></span></span><span id="sLab">Spin</span></button>
<div id="spinMenu"></div>
<button id="replay"><b>Replay shot</b><span>same lie &amp; wind</span></button>
<div id="toast"></div>
<div id="call"></div>
<div id="achT"></div>
<div id="card"><div class="box"><div id="cT"></div><div id="cS"></div><div id="cB"></div><button id="cBtn"></button></div></div>
<div id="sab"></div>

function sampleSpline(pts,step){
  const out=[];
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[Math.max(0,i-1)],p1=pts[i],p2=pts[i+1],p3=pts[Math.min(pts.length-1,i+2)];
    const n=Math.max(2,Math.ceil(Math.hypot(p2[0]-p1[0],p2[1]-p1[1])/step));
    for(let j=0;j<n;j++){
      const t=j/n,t2=t*t,t3=t2*t;
      const f=(a,b,c,d)=>0.5*(2*b+(-a+c)*t+(2*a-5*b+4*c-d)*t2+(-a+3*b-3*c+d)*t3);
      out.push({x:f(p0[0],p1[0],p2[0],p3[0]),y:f(p0[1],p1[1],p2[1],p3[1])});
    }
  }
  const l=pts[pts.length-1];out.push({x:l[0],y:l[1]});return out;
}
function distToPath(path,x,y){
  let best=1e12;
  for(let i=0;i<path.length-1;i++){
    const a=path[i],b=path[i+1],dx=b.x-a.x,dy=b.y-a.y,L=dx*dx+dy*dy;
    let t=L?((x-a.x)*dx+(y-a.y)*dy)/L:0;t=t<0?0:t>1?1:t;
    const px=a.x+dx*t-x,py=a.y+dy*t-y,d=px*px+py*py;if(d<best)best=d;
  }
  return Math.sqrt(best);
}
function offsetPoly(path,hw){
  const L=[],R=[];
  for(let i=0;i<path.length;i++){
    const a=path[Math.max(0,i-1)],b=path[Math.min(path.length-1,i+1)];
    let dx=b.x-a.x,dy=b.y-a.y;const l=Math.hypot(dx,dy)||1;dx/=l;dy/=l;
    L.push({x:path[i].x-dy*hw,y:path[i].y+dx*hw});R.push({x:path[i].x+dy*hw,y:path[i].y-dx*hw});
  }
  const poly=L.slice();
  const e=path[path.length-1],pe=path[path.length-2],aE=Math.atan2(e.y-pe.y,e.x-pe.x);
  for(let k=1;k<12;k++){const a=aE+Math.PI/2-Math.PI*k/12;poly.push({x:e.x+Math.cos(a)*hw,y:e.y+Math.sin(a)*hw});}
  for(let i=R.length-1;i>=0;i--)poly.push(R[i]);
  const s0=path[0],s1=path[1],aS=Math.atan2(s0.y-s1.y,s0.x-s1.x);
  for(let k=1;k<12;k++){const a=aS+Math.PI/2-Math.PI*k/12;poly.push({x:s0.x+Math.cos(a)*hw,y:s0.y+Math.sin(a)*hw});}
  return poly;

/* ---------------- physics ---------------- */
function impact(st){
  st.z=0;const s=surfaceAt(st.x,st.y);
  if(s==="water"||s==="ob"){st.done=s;return;}
  const sp=Math.hypot(st.vx,st.vy),dx=st.x-HOLE.pin.x,dy=st.y-HOLE.pin.y;
  if(dx*dx+dy*dy<(CUPR*1.3)**2&&sp<CAPV_APP*1.4){st.done="holed";st.x=HOLE.pin.x;st.y=HOLE.pin.y;return;}
  const P=BOUNCE[s]||BOUNCE.rough,nvz=-st.vz*P.e;
  const kk=Math.min(.95,P.k*(st.kMul||1));st.vx*=kk;st.vy*=kk;st.bounces=(st.bounces||0)+1;
  if(nvz<VZMIN){st.vz=0;st.air=false;}else st.vz=nvz;
  if(st.onImpact)st.onImpact(s,Math.min(1,-st.vz/12+0.3));
}
// green contours: a stronger overall tilt plus rolling humps, so the putt line bends, and bends differently across the green
function slopeAt(x,y){const h=HOLE,p=h.green.ph,u=(x-h.green.x),v=(y-h.green.y);
  return{x:h.slope.x*2.6+0.55*Math.sin(u*0.32+p)*Math.cos(v*0.21),y:h.slope.y*2.6+0.55*Math.cos(u*0.24-p)*Math.sin(v*0.3+p*0.7)};}
// elevation (Alpine): height in yards, piecewise by distance up the hole
function elevAt(x,y){const e=HOLE&&HOLE.elev;if(!e)return 0;if(y<=e[0][0])return e[0][1];
  for(let i=1;i<e.length;i++)if(y<=e[i][0]){const t=(y-e[i-1][0])/(e[i][0]-e[i-1][0]);return e[i-1][1]+(e[i][1]-e[i-1][1])*t;}return e[e.length-1][1];}
const ELEV_K=0.8; // each yard of drop adds about 0.8y of carry
function playsLike(x0,y0,x1,y1){return Math.hypot(x1-x0,y1-y0)-(elevAt(x0,y0)-elevAt(x1,y1))*ELEV_K;}
function stepBall(st,dt){
  if(st.air){st.x+=st.vx*dt;st.y+=st.vy*dt;st.z+=st.vz*dt;st.vz-=gv()*dt;if(st.z<=0)impact(st);return;}
  const s=surfaceAt(st.x,st.y);
  if(s==="water"||s==="ob"){st.done=s;return;}
  if(s==="green"||s==="fringe"){const g=slopeAt(st.x,st.y);st.vx+=g.x*dt;st.vy+=g.y*dt;}
  else if(HOLE.elev){const gr=(elevAt(st.x,st.y+1)-elevAt(st.x,st.y-1))/2;st.vy-=gr*7*dt;}
  let sp=Math.hypot(st.vx,st.vy);
  const dx=st.x-HOLE.pin.x,dy=st.y-HOLE.pin.y;
  const cR=(st.cupR||CUPR)*(1+0.08*GR("putter"));
  if(dx*dx+dy*dy<cR*cR){
    if(sp<(st.capV||CAPV_PUTT)*(1+0.08*GR("putter"))){st.done="holed";st.x=HOLE.pin.x;st.y=HOLE.pin.y;return;}
    if(!st.lip){st.lip=true;const side=(dx*st.vy-dy*st.vx)>0?-1:1,a=side*0.35,c=Math.cos(a),sn=Math.sin(a),vx=st.vx*c-st.vy*sn,vy=st.vx*sn+st.vy*c;st.vx=vx*.75;st.vy=vy*.75;sp*=.75;}
  }else st.lip=false;
  const ns=sp-fr(s)*dt;
  if(ns<=0.03){st.vx=st.vy=0;st.done="stop";return;}
  const k=ns/sp;st.vx*=k;st.vy*=k;st.x+=st.vx*dt;st.y+=st.vy*dt;
}
function simPutt(x,y,ang,v){
  const st={x,y,vx:Math.cos(ang)*v,vy:Math.sin(ang)*v,cupR:CUPR_PUTT},path=[{x,y}];
  for(let i=0;i<1600&&!st.done;i++){stepBall(st,DT);if(i%3===0)path.push({x:st.x,y:st.y});}
  path.push({x:st.x,y:st.y});return{path,done:st.done};
}

/* ---------------- flow ---------------- */
function startHole(i){
  CU=null;HI=i;HOLE=HOLES[i];strokes=0;lie="tee";phase="aim";snap=null;trail=[];splash=null;birds=false;$("birds").textContent="🦅 Bird’s-eye";
  ball.x=HOLE.tee.x;ball.y=HOLE.tee.y+0.5;ball.h=0;
  if(RW[i])WIND={...RW[i]};else{
  const lv=WX.wind==='random'?(TH.windy?['breezy','strong','strong','breezy']:['calm','light','light','breezy','breezy','strong'])[Math.floor(Math.random()*(TH.windy?4:6))]:WX.wind,rg=WINDLV[lv];
  WIND={mph:Math.round(rg[0]+Math.random()*(rg[1]-rg[0])),ang:Math.random()*Math.PI*2};RW[i]={...WIND};}
  if(TH.noWind){WIND={mph:0,ang:WIND.ang};WX.cond="sunny";}
  HS={putts:0,driveDone:HOLE.par<4,drove:null,fw:false,green:false,gir:false,prox:null,newRec:false};celeb=null;
  hideReplay();updateHUD();camTarget();Object.assign(cam,camT);
}
function takeShot(a){
  CU=null;snap={x:ball.x,y:ball.y,lie,strokes};strokes++;hideReplay();trail=[];
  lastPutt=!!a.putt;if(a.putt&&HS)HS.putts++;shotStartD=Math.hypot(HOLE.pin.x-ball.x,HOLE.pin.y-ball.y);
  if(a.putt){
    const pk=0,pv=a.v*(1+(Math.random()-.5)*2*(0.02+0.15*a.power)*pk),pa=a.ang+(Math.random()-.5)*2*(0.3+5*a.power)*pk*Math.PI/180;
    R={x:ball.x,y:ball.y,vx:Math.cos(pa)*pv,vy:Math.sin(pa)*pv,z:0,vz:0,air:false,capV:CAPV_PUTT,cupR:CUPR_PUTT};rollT=0;acc=0;phase="roll";
    GF={x:ball.x,y:ball.y,ang:a.ang,t:0,power:a.power,putt:true};shotDir={x:Math.cos(a.ang),y:Math.sin(a.ang)};sfx("putt");updateHUD();return;
  }
  const cl=a.club||pickClub(a.carry);let em=errMul(lie,a.power,cl);
  if(a.power>0.93){em*=1.9;}  // going flat out costs control
  // spin: + = topspin (lower, runs), - = backspin (higher, stops). Better clubs amplify it.
  const e=spinSel*(1+0.3*GR(spinGroup(cl)));
  const ang=a.ang+(Math.random()-.5)*2*SPREAD[lie]*em*Math.PI/180;
  let carry=a.carry*(1+(Math.random()-.5)*2*CVAR[lie]*em);
  if(HOLE.elev){const base=carry;for(let k=0;k<3;k++){const lx=ball.x+Math.cos(ang)*carry,ly=ball.y+Math.sin(ang)*carry;carry=clamp(base+(elevAt(ball.x,ball.y)-elevAt(lx,ly))*ELEV_K,base*0.6,base*1.4);}}
  const dx=Math.cos(ang)*carry,dy=Math.sin(ang)*carry,wk=WIND.mph/220*carry*(0.7+cl.apex*2.2)*clamp(1-0.08*e,0.7,1.4),wx=Math.cos(WIND.ang)*wk,wy=Math.sin(WIND.ang)*wk;
  const ignore=HOLE.trees.filter(t=>(ball.x-t.x)**2+(ball.y-t.y)**2<(t.r+1)**2);
  F={sx:ball.x,sy:ball.y,dx,dy,wx,wy,carry,T:(0.9+carry/115)*cl.T*clamp(1-0.04*e,0.85,1.15)*(TH.lowG?1.7:1)*0.76,t:0,apex:(carry*cl.apex+1.2)*clamp(1-0.12*e,0.55,1.6)*(TH.lowG?2:1),ignore,aimAng:a.ang,club:cl,spin:e,spinSel};
  spinSel=0;updSpinBtn();
  GF={x:snap.x,y:snap.y,ang:a.ang,t:0,power:a.power,putt:false};shotDir={x:Math.cos(ang),y:Math.sin(ang)};phase="flight";sfx("hit",a.power);updateHUD();
}
function updFlight(dt){
  F.t+=dt;const s=Math.min(1,F.t/F.T);
  ball.x=F.sx+F.dx*s+F.wx*s*s;ball.y=F.sy+F.dy*s+F.wy*s*s;ball.h=4*F.apex*s*(1-s);
  trail.push({x:ball.x,y:ball.y,h:ball.h});if(trail.length>45)trail.shift();
  for(const t of HOLE.trees){
    if(F.ignore.includes(t))continue;
    const dx=ball.x-t.x,dy=ball.y-t.y;
    if(dx*dx+dy*dy<t.r*t.r&&ball.h<t.h){treeHit(t);return;}
  }
  if(s>=1){ball.h=0;land();}
}
function treeHit(t){
  sfx("tree");toast("Clipped the trees!");
  const ddx=ball.x-t.x,ddy=ball.y-t.y,dl=Math.hypot(ddx,ddy)||1,sp=2+Math.random()*4;
  R={x:ball.x,y:ball.y,vx:ddx/dl*sp-shotDir.x*2,vy:ddy/dl*sp-shotDir.y*2,z:Math.max(0.5,ball.h),vz:-2,air:true,capV:CAPV_APP,onImpact:bounceSfx};
  rollT=0;acc=0;phase="roll";
}
function land(){
  const s=surfaceAt(ball.x,ball.y);
  const tot=Math.hypot(ball.x-F.sx,ball.y-F.sy),c=Math.cos(F.aimAng),sn=Math.sin(F.aimAng),lat=c*F.wy-sn*F.wx;
  if(F.carry>30)toast(`${F.club.n}${F.spinSel?" · "+SPINNAME[F.spinSel]:""} · `+(Math.abs(lat)>=1?`${Math.round(tot)}y · wind ${Math.round(Math.abs(lat))}y ${lat>0?"left":"right"}`:`${Math.round(tot)}y`));
  if(s==="water"||s==="ob")return penalty(s);
  const pdx=ball.x-HOLE.pin.x,pdy=ball.y-HOLE.pin.y;if(pdx*pdx+pdy*pdy<(CUPR*1.3)**2)return holed();
  let vx=F.dx+2*F.wx,vy=F.dy+2*F.wy;const l=Math.hypot(vx,vy)||1;
  // total run-out after landing (bounces + roll), then solve for the forward speed that covers it
  const cl=F.club;
  const ee2=F.spin*(({rough:.5,deep:.3,sand:0,pot:0})[s]??1);
  const kM=clamp(cl.k*(ee2>0?1+0.04*ee2:1+0.08*ee2),0.3,1.2),P0=BOUNCE[s]||BOUNCE.rough,P={e:P0.e,k:Math.min(.95,P0.k*kM),h:P0.h};
  let D=F.carry*(ROLLF[s]||0)*COND[WX.cond].roll*cl.roll*(TH.firm&&s!=="sand"&&s!=="pot"?1.6:1)*(ee2>=0?1+0.6*ee2:1+0.45*ee2);D=Math.min(D,F.carry*(s==="ice"?0.5:TH.firm?0.33:0.25));if(spinGroup(cl)!=="wedges")D=Math.max(D,F.carry*0.012);if(TH.lowG)D*=1.35;

    const v0=Math.sqrt(2*fr(s)*(-D)),l2=Math.hypot(vx,vy)||1;
    R={x:ball.x,y:ball.y,vx:-vx/l2*v0,vy:-vy/l2*v0,z:0,vz:Math.sqrt(2*gv()*0.3),air:true,capV:CAPV_APP,onImpact:bounceSfx,kMul:0.9};
    rollT=0;acc=0;phase="roll";sfx("thud");if(-D>1.2){callout("Zipped it back!","good");ach("zip");}return;
  }
  const h1=clamp(F.carry*0.02,0.5,4)*P.h*COND[WX.cond].bounce*cl.bnc*(TH.firm?1.15:1)*clamp(1-0.12*ee2,0.4,1.5)*(TH.lowG?1.6:1),vz0=h1>0?Math.sqrt(2*gv()*h1):0;
  let a=0,n=0,vz=vz0;
  while(vz>=VZMIN&&n<8){a+=Math.pow(P.k,n)*2*vz/gv();n++;vz*=P.e;}
  const b=Math.pow(P.k,2*n)/(2*fr(s));
  const v0=D<=0?0:(b>0?(-a+Math.sqrt(a*a+4*b*D))/(2*b):D/Math.max(a,0.01));

}
function updRoll(dt){
  dt*=CU&&!CU.drop?0.6:lastPutt?1:1.25;
  rollT+=dt;acc+=dt;
  while(acc>=DT&&!R.done){acc-=DT;stepBall(R,DT);}
  if(CU&&!CU.end){CU.lx=R.x;CU.ly=R.y;CU.lz=R.air?Math.max(0,R.z):0;if(R.done&&R.done!=="holed")CU.end=CU.t;else{const dx=HOLE.pin.x-R.x,dy=HOLE.pin.y-R.y;if(Math.hypot(dx,dy)>2.6&&dx*R.vx+dy*R.vy<0)CU.end=CU.t-0.3;}}
  else if(!CU&&!R.done&&MODE!=="intro"){const dx=HOLE.pin.x-R.x,dy=HOLE.pin.y-R.y,d=Math.hypot(dx,dy),sp=Math.hypot(R.vx,R.vy);
    if(d<4.5&&d>0.3&&sp>0.3&&(dx*R.vx+dy*R.vy)>0&&shotStartD>1.4)CU={u:{x:dx/d,y:dy/d},t:0,lx:R.x,ly:R.y,lz:0};}

  ball.h=R.air?Math.max(0,R.z):0;
  if(phase==="roll"&&trail.length)trail.shift();

  if(R.done==="water"||R.done==="ob")return penalty(R.done);

function bounceSfx(s,v){if(s==="sand"||s==="pot")sfx("sand");else noise(.06,450+300*v,1,.12+.25*v);}
function settle(){
  ball.h=0;lie=surfaceAt(ball.x,ball.y);if(lie==="water"||lie==="ob")return penalty(lie);
  if(MODE==="mini")return miniSettle();
  if(MODE==="daily"){phase="dailydone";const d=Math.hypot(HOLE.pin.x-ball.x,HOLE.pin.y-ball.y);callout(d*3<=15?`${Math.round(d*3)} ft. Great shot!`:`${Math.round(d*3)} ft from the pin`,d*3<=15?"good":"info");setTimeout(()=>dailyCard(d*3,lie==="green"),1500);return;}
  if((lie==="sand"||lie==="pot")&&HS)HS.sandAt=strokes;
  phase="aim";updateHUD();showReplay();react();
}
// what just happened? stats bookkeeping + a callout
function react(){
  const d=Math.hypot(HOLE.pin.x-ball.x,HOLE.pin.y-ball.y),shot=Math.hypot(ball.x-snap.x,ball.y-snap.y),onG=lie==="green";
  let msg=null,tone="info";
  if(!HS.driveDone&&snap.lie==="tee"&&snap.strokes===0){
    HS.driveDone=true;HS.drove=shot;HS.fw=lie==="fairway";
    if(lie==="fairway"&&shot>=265)ach("bomb");
    if(lie==="fairway")[msg,tone]=shot>=265?[`Monster drive! ${Math.round(shot)}y`,"great"]:shot>=232?[`Great drive! ${Math.round(shot)}y`,"good"]:["Down the middle","info"];
  }
  if(onG&&!HS.green){HS.green=true;if(strokes<=HOLE.par-2){HS.gir=true;HS.prox=d;}}
  if(!msg){
    if(lastPutt){
      if(shotStartD<2.2)[msg,tone]=["Missed a short one!","bad"];
      else if(shotStartD>10&&d<1.2)[msg,tone]=["Lovely lag putt","info"];
    }else if(onG)[msg,tone]=d<=1.2?["Stiff! Tap-in range","great"]:d<=4?[`Nice approach! ${ftxt(d)}`,"good"]:["On the green","info"];
    else if(lie==="fringe")[msg,tone]=["Just off the green","info"];
    else if(lie==="pot")[msg,tone]=[TH.space?"In a crater! Just get it out":"Pot bunker! Just get it out","bad"];
    else if(lie==="ice")[msg,tone]=["Skidded onto the ice!","info"];
    else if(lie==="sand")[msg,tone]=["Found the sand","bad"];
    else if(lie==="deep")[msg,tone]=["Deep rough. Tough lie","bad"];
    else if(lie==="rough")[msg,tone]=[snap.lie==="tee"?"Missed the fairway":"In the rough","info"];
    else if(lie==="fairway"&&(snap.lie==="sand"||snap.lie==="pot"))[msg,tone]=["Good escape","info"];
  }
  if(msg)callout(msg,tone);
}
function penalty(kind){
  phase="penalty";timer=1.5;ball.h=0;crowd.groan();
  if(kind==="water"||TH.ocean){PF.cnt=PF.cnt||{};PF.cnt.water=(PF.cnt.water||0)+1;savePF();if(PF.cnt.water>=10)ach("fish");}
  if(HS&&!HS.driveDone&&snap&&snap.lie==="tee"&&snap.strokes===0){HS.driveDone=true;HS.fw=false;}
  if(kind==="water"){sfx("splash");splash={x:ball.x,y:ball.y,t:0};toast(TH.liquid==="lava"?"Into the lava! +1 penalty stroke":TH.liquid==="crevasse"?"Lost in a crevasse! +1 penalty stroke":"Splash! +1 penalty stroke");}
  else if(TH.ocean&&distToPath(HOLE.center,ball.x,ball.y)>HOLE.ob+8){sfx("splash");splash={x:ball.x,y:ball.y,t:0};toast("Into the sea! +1 penalty stroke");}
  else toast("Out of bounds! +1 penalty stroke");
}
function holed(){

  if(CU)CU.drop={t:0,x:fromX,y:fromY};else if(phase==="flight"&&F&&!lastPutt){const dx=HOLE.pin.x-F.sx,dy=HOLE.pin.y-F.sy,d=Math.hypot(dx,dy)||1;CU={u:{x:dx/d,y:dy/d},t:0,lx:HOLE.pin.x-dx/d*0.4,ly:HOLE.pin.y-dy/d*0.4,lz:1.2,drop:{t:0,x:HOLE.pin.x-dx/d*0.4,y:HOLE.pin.y-dy/d*0.4}};}
  ball.x=HOLE.pin.x;ball.y=HOLE.pin.y;ball.h=0;phase="holed";sinkT=0;scores[HI]=strokes;trail=[];
  sfx("cup");hideReplay();updateHUD();
  const diff=strokes-HOLE.par,name=scoreName(diff,strokes);
  // hole-out bonus line
  let sub=null;
  if(sub===null&&HS)HS.bonus=HS.bonus||0;
  if(!lastPutt&&strokes>1)sub=shotStartD<35?"Chip in!":`Holed out from ${Math.round(shotStartD)}y!`;
  else if(lastPutt&&shotStartD>=8)sub=`What a putt! ${ftxt(shotStartD)}`;

  if(!HS.driveDone&&HOLE.par>=4){HS.driveDone=true;HS.fw=true;}

  ball.x=HOLE.pin.x;ball.y=HOLE.pin.y;ball.h=0;phase="minidone";trail=[];sfx("cup");
  if(MG.type==="ctp"){crowd.huge();burst(200,true);callout("HOLE IN ONE!","great");ach("hio");setTimeout(()=>miniNext(0),2200);}
  else{crowd.good();callout(`Holed from ${MG.pos[MG.i]?MG.pos[MG.i].ft:""} ft!`,"good");setTimeout(()=>miniNext(1),1100);}
}
function miniNext(r){
  if(!MG||MODE!=="mini")return;MG.res.push(r);MG.i++;updateHUD();
  if(MG.i>=MINIS[MG.type].n)setTimeout(miniEnd,1300);else setTimeout(()=>{if(MG&&MODE==="mini")miniPlace();},1400);
}
function miniEnd(){
  const t=MG.type,m=MINIS[t];let score,better,xp,rows;
  if(t==="ctp"){score=MG.res.reduce((a,r)=>a+(r==null?150:r),0);better=v=>v<(miniBest(t)??1e9);xp=Math.max(5,Math.round(40-score/6));rows=MG.res.map((r,i)=>`<tr><td>Ball ${i+1}</td><td>${r==null?"Penalty (150 ft)":r===0?"🎯 Hole in one":r+" ft"}</td></tr>`).join("");}
  else if(t==="putt"){score=MG.res.filter(r=>r===1).length;better=v=>v>(miniBest(t)??-1);xp=score*4;rows=MG.res.map((r,i)=>`<tr><td>${MG.pos[i].ft} ft</td><td>${r===1?"✅ Holed":"❌ Missed"}</td></tr>`).join("");}
  else{const v=MG.res.filter(r=>r&&r.fw).map(r=>r.d);score=v.length?Math.max(...v):0;better=v=>v>(miniBest(t)??0);xp=Math.round(8+Math.max(0,score-180)/4);rows=MG.res.map((r,i)=>`<tr><td>Drive ${i+1}</td><td>${r==null?"Penalty":Math.round(r.d)+"y"+(r.fw?" ✅":" ❌ rough")}</td></tr>`).join("");}
  const nb=better(score);if(nb){PF.mini=PF.mini||{};PF.mini[t]=score;}const ups=addXP(xp);savePF();
  if(nb)setTimeout(()=>{crowd.cheer();burst(120,false);},300);
  openCard(`${m.icon} ${miniFmt(t,score)}`,`${m.name} · ${HOLE.name}`,(nb?`<div class="newbest">🏆 New personal best!</div>`:`<div style="color:#aab1c4;margin-bottom:10px">Best: ${miniFmt(t,miniBest(t))}</div>`)+
   `<div class="tiles">${tile("Score",miniFmt(t,score))}${tile("XP","+"+xp)}${tile("Level",PF.level,ups?"Level up!":"")}</div><table>${rows}</table><button class="mbtn" id="mgMenu"><b>Mini games</b></button><button class="mbtn" id="mgHome"><b>Main menu</b></button>`,"Play again",()=>startMini(t));
  $("mgMenu").onclick=()=>{closeCard();MODE="intro";MG=null;miniMenu();};$("mgHome").onclick=()=>{closeCard();mainMenu();};
}
function tourMenu(){
  const html=TOURS.map(T=>{const open=tourUnlocked(T),tier=TIERS[T.tier],need=T.need?TOURS.find(x=>x.id===T.need.tour):null;
    const head=`<div class="plab" style="margin-top:14px">${open?"":"🔒 "}${T.name} <span style="text-transform:none;letter-spacing:0">· ${T.blurb}</span></div>`;
    if(!open)return head+`<div class="row" style="opacity:.6"><div class="rt"><b>Locked</b><div class="rd">Win ${T.need.wins} ${need.name} events to unlock (${tourWins(need.id)} of ${T.need.wins})${T.soon?". "+T.soon:""}</div><div class="rd">${T.courses.map(c=>COURSES.find(x=>x.id===c).icon).join(" ")}</div></div></div>`;
    const nT=TOURS[TOURS.indexOf(T)+1],prog=nT&&!tourUnlocked(nT)?`<div class="rd" style="margin:-2px 0 6px;text-align:left">${tourWins(T.id)} of ${nT.need.wins} wins to unlock the ${nT.name}</div>`:"";
    return head+prog+T.courses.map(cid=>{const c=COURSES.find(x=>x.id===cid),b=tbest(cid,T.id);
      return `<button class="mbtn tev" data-t="${T.id}" data-c="${cid}" style="text-align:left;flex-direction:row;align-items:center;gap:10px;padding:9px 11px;margin-top:6px"><span style="font-size:24px">${c.icon}</span><span style="flex:1;display:flex;flex-direction:column;color:#fff;font-size:15px"><b>${c.tiers[T.tier][0]}</b><span>${c.name} · ${TEES[tier.tee].name} tees · purse ${money(tier.purse)}</span></span><span style="font-size:12px;font-weight:800;color:${b===1?"var(--gold)":"#aab1c4"}">${b?ord(b):"New"}</span></button>`;}).join("")+(T.soon?`<div class="rd" style="text-align:left;margin-top:6px">${T.soon}</div>`:"");}).join("");
  openCard("Tours","Win events to move up a tour and open new courses",html+`<button class="mbtn" id="tBack" style="margin-top:12px"><b>Back</b></button>`,null,null);
  document.querySelectorAll(".tev").forEach(b=>b.onclick=()=>{const T=TOURS.find(x=>x.id===b.dataset.t);if(!tourUnlocked(T))return;setCourse(b.dataset.c);closeCard();beginRound("tour",0,TIERS[T.tier]);});
  $("tBack").onclick=mainMenu;
}
function playerMenu(){
  openCard("Player & Skills",`Level ${PF.level} · ${PF.points} point${PF.points===1?"":"s"} to spend`,
   profHead()+`<div style="height:8px"></div>`+SKILLS.map(([k,n,d])=>`<div class="row"><div class="rt"><b>${n}</b> <span style="color:#8f98ae;font-size:12px">${SK(k)}/10</span><div class="rd">${d}</div><div class="pips">${Array.from({length:10},(_,i)=>`<i class="${i<SK(k)?"on":""}"></i>`).join("")}</div></div>
   <button class="plus" data-k="${k}" ${PF.points>0&&SK(k)<10?"":"disabled"}>+1</button></div>`).join("")+
   `<div class="plab">Golfer look</div>`+["shirt","cap","pants"].map(k=>`<div class="row" style="padding:7px 10px"><b style="width:52px;text-transform:capitalize">${k==="pants"?"Trousers":k}</b><div style="display:flex;gap:6px;flex-wrap:wrap">${LOOKS[k].map(c=>`<button class="sw${PF.look[k]===c?" on":""}" data-k="${k}" data-c="${c}" style="background:${c}"></button>`).join("")}</div></div>`).join("")+
   `<p style="font-size:12px;color:#8f98ae;margin:4px 0 0">Earn XP every hole. Tournaments give full XP, practice gives half. Harder tees multiply it.</p><button class="mbtn" id="pfReset" style="margin-top:8px"><b>🔄 Fresh start</b><span>Reset level, skills, money and clubs (keeps stats and records)</span></button>`,"Back",mainMenu);
  document.querySelectorAll(".sw").forEach(b=>b.onclick=()=>{PF.look[b.dataset.k]=b.dataset.c;savePF();playerMenu();});
  $("pfReset").onclick=()=>{const b=$("pfReset");if(b.dataset.c){const keep={name:PF.name,look:PF.look,seen:PF.seen};PF=Object.assign(blankProfile(),keep);savePF();toast("Fresh start: level 1, £0, stock clubs");playerMenu();}else{b.dataset.c=1;b.innerHTML="<b>Tap again to restart your career</b><span>Level, skills, money, clubs, achievements and daily progress all go back to the start</span>";}};
  document.querySelectorAll(".plus").forEach(b=>b.onclick=()=>{const k=b.dataset.k;if(PF.points<1||SK(k)>=10)return;PF.skills[k]=SK(k)+1;PF.points--;savePF();tone(880,.12,.15,"triangle");playerMenu();});
}
function shopMenu(){
  openCard("Pro Shop",`You have ${money(PF.money)}`,
   GEAR.map(([k,n,names,d])=>{const t=GR(k),nx=t<3?PRICES[t]:null;return `<div class="row"><div class="rt"><b>${names[t]}</b><div class="rd">${n} · ${d}</div><div class="pips">${[0,1,2].map(i=>`<i class="${i<t?"on":""}" style="width:22px"></i>`).join("")}</div></div>
   ${nx!=null?`<button class="plus" data-k="${k}" ${PF.money>=nx?"":"disabled"}>${names[t+1].split(" ")[0]}<br>${money(nx)}</button>`:`<span style="color:var(--gold);font-weight:800;font-size:12px">MAXED</span>`}</div>`;}).join("")+
   `<p style="font-size:12px;color:#8f98ae;margin:4px 0 0">Win prize money in tournaments. Better clubs also make your topspin and backspin stronger.</p>`,"Back",mainMenu);
  document.querySelectorAll(".plus").forEach(b=>b.onclick=()=>{const k=b.dataset.k,t=GR(k);if(t>=3||PF.money<PRICES[t])return;PF.money-=PRICES[t];PF.gear[k]=t+1;savePF();if(t+1===3)ach("legend");fanfare();shopMenu();});
}
function chips(id,opts,cur){return `<div class="chips" id="${id}">`+opts.map(([v,l])=>`<button class="chip${v==cur?" on":""}" data-v="${v}">${l}</button>`).join("")+`</div>`;}
let PR={cond:"sunny",wind:"light",hole:0,tee:TEE,rep:3};let REPS=0;
function practiceMenu(){
  openCard("Practice Round",`${COURSE.icon} ${COURSE.name} · half XP`,
   `<div class="plab">Tees</div>`+chips("pT",[["red","🔴 Red ×0.75"],["yellow","🟡 Yellow ×1"],["white","⚪ White ×1.5"]],PR.tee)+
   `<div class="plab">Weather</div>`+chips("pC",[["sunny","☀️ Sunny"],["overcast","☁️ Overcast"],["rain","🌧️ Rain"],["snow","❄️ Snow"]],PR.cond)+
   `<div class="plab">Wind</div>`+chips("pW",[["calm","Calm"],["light","Light"],["breezy","Breezy"],["strong","Strong"],["random","Random"]],PR.wind)+
   `<div class="plab">Replay shots</div>`+chips("pR",[[0,"None"],[3,"3"],[5,"5"],[-1,"Unlimited"]],PR.rep)+
   `<div class="plab">Start at hole</div>`+chips("pH",HOLES.map((h,i)=>[i,String(i+1)]),PR.hole)+
   `<div id="pHn" class="pname"></div><button class="mbtn" id="pBack" style="margin-top:4px"><b>Back</b></button>`,
   "Tee off",()=>{WX={cond:PR.cond,wind:PR.wind};try{localStorage.setItem("parkland-classic-tee",PR.tee);}catch(e){}beginRound("prac",PR.hole);});
  const wire=(id,key,num)=>$(id).querySelectorAll(".chip").forEach(b=>b.onclick=()=>{PR[key]=num?+b.dataset.v:b.dataset.v;$(id).querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x===b));nm();});
  const nm=()=>{TEE=PR.tee;const h=HOLES[PR.hole];$("pHn").textContent=`${h.name} · Par ${h.par} · ${h.length}y from the ${TEES[PR.tee].name.toLowerCase()} tees`;};
  wire("pT","tee");wire("pC","cond");wire("pW","wind");wire("pH","hole",true);wire("pR","rep",true);nm();
  $("pBack").onclick=pickBack;
}
function closeCard(){$("card").classList.remove("on");cardOpen=false;}
$("menuBtn").addEventListener("click",()=>{if(cardOpen)return;drag=null;mainMenu();});
{let c="parkland";try{c=localStorage.getItem("parkland-classic-course")||c;}catch(e){}setCourse(c);}
HOLE=HOLES[0];startHole(0);phase="intro";updateHUD();
mainMenu();
if(/^#ch=/.test(location.hash)){try{const sp=b64d(location.hash.slice(4));history.replaceState(null,"",location.pathname+location.search);challengeIntro(sp);}catch(e){toast("That challenge link didn't work");}}
if("serviceWorker" in navigator&&/^https?:/.test(location.protocol)){navigator.serviceWorker.register("sw.js").catch(()=>{});}
requestAnimationFrame(frame);
window.__golf={get state(){return{phase,lie,strokes,ball:{...ball},HI,scores:scores.slice()}},get HOLES(){return HOLES},surfaceAt:(x,y)=>surfaceAt(x,y),simPutt,takeShot,computeAim,setSpin:v=>{spinSel=v;},setCourse:c=>{setCourse(c);startHole(0);},setBall:(x,y)=>{ball.x=x;ball.y=y;lie=surfaceAt(x,y);phase="aim";updateHUD();}};
})();
